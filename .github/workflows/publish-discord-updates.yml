name: Publish Discord latest updates

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/discord-latest-updates-2026-10-09.md"
      - ".github/workflows/publish-discord-updates.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out announcement
        uses: actions/checkout@v4

      - name: Publish announcement using Discord bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1557983116658741299"
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          channel_id = os.environ.get("DISCORD_CHANNEL_ID", "").strip()
          if not token:
              raise SystemExit("DISCORD_BOT_TOKEN is missing. Add it under GitHub Settings > Secrets and variables > Actions.")
          if not channel_id.isdigit():
              raise SystemExit("DISCORD_CHANNEL_ID is missing or invalid.")

          with open("docs/discord-latest-updates-2026-10-09.md", encoding="utf-8") as f:
              announcement = f.read().strip()

          # Discord message content limit is 2000 characters.
          chunks = []
          while len(announcement) > 1900:
              split_at = announcement.rfind("\n\n", 0, 1900)
              if split_at < 500:
                  split_at = announcement.rfind(" ", 0, 1900)
              if split_at < 1:
                  split_at = 1900
              chunks.append(announcement[:split_at].strip())
              announcement = announcement[split_at:].strip()
          if announcement:
              chunks.append(announcement)

          for index, chunk in enumerate(chunks, start=1):
              payload = json.dumps({"content": chunk}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://discord.com/api/v10/channels/{channel_id}/messages",
                  data=payload,
                  headers={
                      "Authorization": f"Bot {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "BC-TRUCK-WORKS-GitHub-Actions/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status not in (200, 201):
                          raise SystemExit(f"Discord returned HTTP {response.status} for message {index}.")
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  # Never print the bot token.
                  raise SystemExit(
                      f"Discord bot API returned HTTP {error.code} for message {index}. "
                      f"Response: {details[:1000]}"
                  ) from None

          print(f"Published {len(chunks)} announcement message(s) to Discord.")
          PY
