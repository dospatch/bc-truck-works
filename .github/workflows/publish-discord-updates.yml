name: Publish Discord latest updates

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/discord-latest-updates-2026-10-09.md"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out announcement
        uses: actions/checkout@v4

      - name: Publish announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook.startswith("https://discord.com/api/webhooks/"):
              raise SystemExit("DISCORD_WEBHOOK_URL is missing or is not a Discord webhook URL.")

          with open("docs/discord-latest-updates-2026-10-09.md", encoding="utf-8") as f:
              text = f.read().strip()

          chunks = []
          current = ""
          for paragraph in text.split("\n\n"):
              candidate = paragraph if not current else current + "\n\n" + paragraph
              while len(candidate) > 1800:
                  chunks.append(candidate[:1800])
                  candidate = candidate[1800:].lstrip()
                  current = ""
              if candidate:
                  current = candidate
          if current:
              chunks.append(current)

          for index, chunk in enumerate(chunks, start=1):
              payload = json.dumps({"content": chunk}).encode("utf-8")
              req = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if response.status not in (200, 204):
                          raise SystemExit(f"Discord returned HTTP {response.status} for message {index}.")
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  # Report Discord's response body, never the webhook URL or token.
                  raise SystemExit(
                      f"Discord returned HTTP {error.code} for message {index}. "
                      f"Discord response: {details[:1000]}"
                  ) from None

          print(f"Published {len(chunks)} announcement message(s) to Discord.")
          PY
