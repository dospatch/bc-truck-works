name: Check BC TRUCK WORKS Bot

on:
  push:
    paths:
      - "index.js"
      - ".github/workflows/check-bot.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check index.js
