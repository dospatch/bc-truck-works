name: Build BC TRUCK WORKS Connector

on:
  workflow_dispatch:
  push:
    paths:
      - "connector/**"
      - ".github/workflows/build-connector.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows executable
        run: npm run build
      - name: Upload connector
        uses: actions/upload-artifact@v4
        with:
          name: bc-truck-works-connector-windows
          path: connector/dist/bc-truck-works-connector.exe
