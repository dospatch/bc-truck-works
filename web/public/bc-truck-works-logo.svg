<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 1080"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">BC TRUCK WORKS</title>
  <desc id="desc">
    BC TRUCK WORKS trucking, logistics, and simulation logo featuring a
    blue semi truck, mountains, road, and illuminated BC branding.
  </desc>

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="0.5" stop-color="#03101b"/>
      <stop offset="1" stop-color="#01060b"/>
    </linearGradient>

    <!-- Blue glow -->
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="0.5" stop-color="#168cff"/>
      <stop offset="1" stop-color="#005eff"/>
    </linearGradient>

    <!-- Chrome -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b8cad8"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#6f8799"/>
      <stop offset="1" stop-color="#e8f2f8"/>
    </linearGradient>

    <!-- Truck body -->
    <linearGradient id="truckBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9d4e5"/>
      <stop offset="0.3" stop-color="#4e89ad"/>
      <stop offset="0.58" stop-color="#12527b"/>
      <stop offset="1" stop-color="#071824"/>
    </linearGradient>

    <!-- Truck cab -->
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d8dca"/>
      <stop offset="0.45" stop-color="#07547f"/>
      <stop offset="1" stop-color="#03131e"/>
    </linearGradient>

    <!-- Window -->
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102f45"/>
      <stop offset="0.5" stop-color="#06131e"/>
      <stop offset="1" stop-color="#1d668d"/>
    </linearGradient>

    <!-- Road -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d2a"/>
      <stop offset="1" stop-color="#010407"/>
    </linearGradient>

    <!-- Neon frame -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip -->
    <clipPath id="cardClip">
      <rect x="24" y="24" width="672" height="1032" rx="42"/>
    </clipPath>
  </defs>

  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect
    x="0"
    y="0"
    width="720"
    height="1080"
    rx="48"
    fill="url(#bg)"
  />

  <!-- Background glow -->
  <ellipse
    cx="360"
    cy="410"
    rx="270"
    ry="260"
    fill="#006eff"
    opacity=".08"
    filter="url(#softGlow)"
  />

  <!-- ========================= -->
  <!-- MOUNTAINS -->
  <!-- ========================= -->

  <g clip-path="url(#cardClip)">
    <path
      d="M0 520
         L105 400
         L165 455
         L270 315
         L350 410
         L470 250
         L720 540
         L720 720
         L0 720Z"
      fill="#0b2b41"
    />

    <path
      d="M0 600
         L150 445
         L235 525
         L370 370
         L455 470
         L560 330
         L720 525
         L720 730
         L0 730Z"
      fill="#12435e"
    />

    <!-- Mountain highlights -->
    <path
      d="M270 315 L350 410 L316 377 L290 401 L250 358Z"
      fill="#b9d6e7"
      opacity=".75"
    />

    <path
      d="M470 250 L550 345 L510 318 L478 350 L438 300Z"
      fill="#c8deeb"
      opacity=".7"
    />
  </g>

  <!-- ========================= -->
  <!-- BLUE NEON ARC -->
  <!-- ========================= -->

  <path
    d="M150 505
       A210 210 0 0 1 570 505"
    fill="none"
    stroke="#008cff"
    stroke-width="7"
    opacity=".8"
    filter="url(#glow)"
  />

  <path
    d="M175 505
       A185 185 0 0 1 545 505"
    fill="none"
    stroke="#42c8ff"
    stroke-width="3"
    opacity=".7"
  />

  <!-- ========================= -->
  <!-- BC BRAND MARK -->
  <!-- ========================= -->

  <g transform="translate(0 90)">
    <!-- Wings -->
    <path
      d="M95 170
         L185 145
         L175 165
         L115 190
         L175 190
         L155 210
         L95 210Z"
      fill="url(#blueGlow)"
      opacity=".95"
    />

    <path
      d="M625 170
         L535 145
         L545 165
         L605 190
         L545 190
         L565 210
         L625 210Z"
      fill="url(#blueGlow)"
      opacity=".95"
    />

    <!-- BC -->
    <text
      x="360"
      y="220"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="188"
      font-weight="900"
      letter-spacing="-14"
      fill="url(#chrome)"
      stroke="#07131d"
      stroke-width="9"
      paint-order="stroke"
    >
      BC
    </text>

    <!-- Blue underline -->
    <path
      d="M180 245 H540"
      stroke="url(#blueGlow)"
      stroke-width="7"
      stroke-linecap="round"
      filter="url(#glow)"
    />
  </g>

  <!-- ========================= -->
  <!-- SEMI TRUCK -->
  <!-- ========================= -->

  <g transform="translate(75 330)">

    <!-- Trailer -->
    <path
      d="M40 85
         H405
         V285
         H40
         Z"
      fill="url(#truckBody)"
      stroke="#9bcbe5"
      stroke-width="5"
    />

    <!-- Trailer top -->
    <path
      d="M40 85 H405"
      stroke="#4dc2ff"
      stroke-width="8"
      filter="url(#glow)"
    />

    <!-- Trailer side -->
    <rect
      x="65"
      y="112"
      width="315"
      height="130"
      rx="8"
      fill="#071824"
      stroke="#4389aa"
      stroke-width="3"
    />

    <!-- Trailer reflection -->
    <path
      d="M82 145 H365"
      stroke="#7bd5ff"
      stroke-width="5"
      opacity=".45"
    />

    <path
      d="M82 165 H320"
      stroke="#3c8bb2"
      stroke-width="3"
      opacity=".5"
    />

    <!-- Cab -->
    <path
      d="M405 120
         H490
         L565 175
         V285
         H405
         Z"
      fill="url(#cab)"
      stroke="#a8d9ef"
      stroke-width="5"
    />

    <!-- Cab roof -->
    <path
      d="M405 120 H490 L565 175"
      fill="none"
      stroke="#45baff"
      stroke-width="8"
      filter="url(#glow)"
    />

    <!-- Windshield -->
    <path
      d="M425 140
         H480
         L535 180
         H425
         Z"
      fill="url(#window)"
      stroke="#72c9ef"
      stroke-width="4"
    />

    <!-- Windshield reflection -->
    <path
      d="M440 148 H477 L503 166 H440Z"
      fill="#8de0ff"
      opacity=".28"
    />

    <!-- Cab grille -->
    <rect
      x="438"
      y="205"
      width="82"
      height="70"
      rx="8"
      fill="#061019"
      stroke="#8faebe"
      stroke-width="5"
    />

    <path
      d="M450 215 V266
         M462 215 V266
         M474 215 V266
         M486 215 V266
         M498 215 V266
         M510 215 V266"
      stroke="#b9d0dc"
      stroke-width="4"
      opacity=".8"
    />

    <!-- Headlights -->
    <rect
      x="420"
      y="238"
      width="18"
      height="12"
      rx="4"
      fill="#dff7ff"
      filter="url(#glow)"
    />

    <rect
      x="522"
      y="238"
      width="18"
      height="12"
      rx="4"
      fill="#dff7ff"
      filter="url(#glow)"
    />

    <!-- Cab bumper -->
    <path
      d="M405 276 H550"
      stroke="#43bfff"
      stroke-width="8"
      filter="url(#glow)"
    />

    <!-- Wheels -->
    <g>
      <circle
        cx="145"
        cy="300"
        r="45"
        fill="#03070a"
        stroke="#8ea5b5"
        stroke-width="8"
      />
      <circle
        cx="145"
        cy="300"
        r="20"
        fill="#425969"
        stroke="#dce8ef"
        stroke-width="5"
      />
      <circle
        cx="145"
        cy="300"
        r="7"
        fill="#061019"
      />
    </g>

    <g>
      <circle
        cx="485"
        cy="300"
        r="45"
        fill="#03070a"
        stroke="#8ea5b5"
        stroke-width="8"
      />
      <circle
        cx="485"
        cy="300"
        r="20"
        fill="#425969"
        stroke="#dce8ef"
        stroke-width="5"
      />
      <circle
        cx="485"
        cy="300"
        r="7"
        fill="#061019"
      />
    </g>

    <!-- Truck blue accent -->
    <path
      d="M40 258 H405"
      stroke="#35baff"
      stroke-width="7"
      filter="url(#glow)"
    />

  </g>

  <!-- ========================= -->
  <!-- ROAD -->
  <!-- ========================= -->

  <path
    d="M0 690
       Q180 630 360 695
       T720 680
       V1080
       H0Z"
    fill="url(#road)"
  />

  <!-- Road glow -->
  <path
    d="M70 805 Q360 700 650 805"
    fill="none"
    stroke="#149eff"
    stroke-width="9"
    opacity=".75"
    filter="url(#glow)"
  />

  <!-- Road center -->
  <path
    d="M360 735 L320 1080 H400 L360 735Z"
    fill="#0d2535"
  />

  <path
    d="M360 775 L350 815"
    stroke="#eefaff"
    stroke-width="7"
  />

  <path
    d="M345 850 L335 900"
    stroke="#eefaff"
    stroke-width="7"
  />

  <path
    d="M325 950 L310 1015"
    stroke="#eefaff"
    stroke-width="7"
  />

  <!-- ========================= -->
  <!-- TITLE -->
  <!-- ========================= -->

  <text
    x="360"
    y="805"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="67"
    font-weight="900"
    letter-spacing="5"
    fill="#f5faff"
  >
    TRUCK WORKS
  </text>

  <!-- Subtitle -->
  <text
    x="360"
    y="855"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="5"
    fill="#4fc4ff"
  >
    TRUCKING • LOGISTICS • SIMULATION
  </text>

  <!-- ========================= -->
  <!-- LOWER BRANDING -->
  <!-- ========================= -->

  <path
    d="M145 905 H575"
    stroke="#168fd2"
    stroke-width="4"
  />

  <path
    d="M360 905
       L420 1025
       H300
       Z"
    fill="none"
    stroke="#35baff"
    stroke-width="5"
    opacity=".8"
  />

  <path
    d="M360 935
       L388 995
       H332
       Z"
    fill="#126d9d"
    opacity=".75"
  />

  <text
    x="360"
    y="1020"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="800"
    letter-spacing="5"
    fill="#9bb2c2"
  >
    BC TRUCK WORKS
  </text>

  <!-- ========================= -->
  <!-- OUTER NEON FRAME -->
  <!-- ========================= -->

  <rect
    x="25"
    y="25"
    width="670"
    height="1030"
    rx="43"
    fill="none"
    stroke="#007cff"
    stroke-width="5"
    opacity=".9"
    filter="url(#glow)"
  />

  <rect
    x="38"
    y="38"
    width="644"
    height="1004"
    rx="35"
    fill="none"
    stroke="#2db9ff"
    stroke-width="2"
    opacity=".6"
  />

  <!-- Corner accents -->
  <path
    d="M55 115 V55 H115"
    fill="none"
    stroke="#4bc7ff"
    stroke-width="6"
  />

  <path
    d="M605 55 H665 V115"
    fill="none"
    stroke="#4bc7ff"
    stroke-width="6"
  />

  <path
    d="M55 965 V1025 H115"
    fill="none"
    stroke="#4bc7ff"
    stroke-width="6"
  />

  <path
    d="M605 1025 H665 V965"
    fill="none"
    stroke="#4bc7ff"
    stroke-width="6"
  />

</svg>